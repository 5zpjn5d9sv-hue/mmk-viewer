<!DOCTYPE html>
<!--
MMK 3D 뷰어 (261124 현장, 2026-11-24. 틀: 261120 현장 뷰어. 기준: 04_Rhino_작업기준.md 8절)
바꿀 곳만 바꾸고 나머지 코드는 그대로 둔다.
 1. {{ }} 표시: 프로젝트명, 주소(단지·동까지. 고객 이름·전화·가격 넣지 않음), 폴더명
 2. 스크립트 "현장 설정": COLORS(이름·코드·화면색), ALTS(배색별 렌더 컷), ZIP(원본 묶음)
 3. #views 버튼과 PRESET: 실사 컷마다 하나씩. 실사 카메라의 위치·타깃·가로 화각(h)을 그대로 넣는다. key는 ALTS 렌더 key와 같게(이 구도 렌더 보기 버튼)
 4. K: 모델 중심점(mm). 좌표 변환 toV는 규칙 75 기준(X 동·Y 북·Z 위)이라 고치지 않는다
 5. .fixed 문구: 상판·가전·손잡이·바닥 등 이 현장 고정 사양
 6. matFor/PAL: model.json 레이어 이름(l)별 재질. 새 레이어가 있으면 추가
 7. model.json: 작업 공간 객체는 c 없음, 그 밖의 벽은 c:1(기본 숨김, "벽체" 버튼으로 켬, 규칙 73)
 3D 그리기: three r170, RoomEnvironment + GTAO + 견본 사진 무늬목 (2026-11-23, 톨캐비넷 시뮬레이터 방식)
 고정 사양: 자동 회전 없음, 연한 윤곽선 항상 표시, LED가 모델에 있는 장은 켠 느낌
-->

<style>

  .cp-sw{display:grid;grid-template-columns:repeat(4,28px);justify-content:space-between;row-gap:11px}

  .cp-sw button.on{box-shadow:0 0 0 2px #faf8f4,0 0 0 3.2px #34322b}

  @media (max-width:900px){.space-row{flex-direction:column}.color-panel{width:auto}.cp-group.pt .cp-sw{grid-template-columns:repeat(8,28px)}.cp-group.wd .cp-sw{justify-content:flex-start;column-gap:16px}.cp-name{min-height:13px}}
  @media (max-width:720px){.toggles{top:auto;right:auto;left:14px;bottom:14px}}

:is(.cp-group.pt,.cp-group.wd) .cp-sw{display:flex;gap:11.33px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:4px;scrollbar-width:none;padding:5px 4px;margin:-5px -4px;grid-template-columns:none}
:is(.cp-group.pt,.cp-group.wd) .cp-sw::-webkit-scrollbar{display:none}
:is(.cp-group.pt,.cp-group.wd) .cp-sw button{flex:none}

.cp-nav button:not(:disabled):hover{border-color:#34322b}
:is(.cp-group.pt,.cp-group.wd) .cp-name{margin-top:6px}

<script>
/* ---- 현장 설정 ---- */
/* 색 값: 톨캐비넷 시뮬레이터(v39)에서 쓰는 MMK 공식 견본 값. 도장 24색 + 무늬목 4종(견본 사진 질감) */
const PT=[['01','Salmon orange','#d8a78a'],['02','Lime yellow','#dbd9bc'],['03','Avocado green','#6d6e60'],['04','Tomato red','#7c5547'],
 ['05','Choco brown','#5c5353'],['06','Blueberry navy','#4f525c'],['07','Apple mint','#b4beb7'],['08','Forest green','#52594f'],
 ['09','Salt white','#e6e6db'],['10','Candy pink','#ded3d7'],['11','Lemon yellow','#eeecce'],['12','Water blue','#a4aec5'],
 ['13','Air blue','#bbc3ca'],['14','Snow grey','#dadbd5'],['15','Mist grey','#c6c5c2'],['16','Storm black','#444444'],
 ['17','Lavender purple','#b3a9b0'],['18','Olive green','#827f52'],['19','Cinnamon orange','#8f4a38'],['20','Mocha khaki','#594c3a'],
 ['21','Oat beige','#cbc3b5'],['22','Fig burgundy','#643433'],['23','Cherry brown','#3d1c1c'],['24','Guava pink','#e2cbc2']];
const WD=[['01','Natural Oak','#bda787'],['02','Brown Oak','#7e644b'],['03','Dark Brown Oak','#503e30'],['04','Orange Oak','#8f5d38'],['05','Ivory Oak','#cab89f'],['06','Grey Oak','#7c6c5e'],['07','Black Oak','#46454a']];/* 05~07: MMK 홈페이지 Finishes 견본(2026-11-24 사용자 제공) */
const COLORS={sts:{name:"STS",code:"",gl:'#b4b8ba'},cer:{name:"화이트 인조대리석 12T",code:"",gl:'#f0efeb'}};
PT.forEach(([n,name,hex])=>COLORS['PT'+n]={name,code:'MMK PT '+n,chip:hex,gl:hex});
WD.forEach(([n,name,hex])=>COLORS['WD'+n]={name,code:'MMK WD '+n,chip:hex,gl:hex,tex:'assets/tex/WD'+n+'.webp',chipImg:'assets/tex/WD'+n+'_chip.webp'});
COLORS.white=COLORS.PT09;COLORS.oak=COLORS.WD01;
/* 색상 변경 칸(3D 오른쪽 세로): 이 현장은 상부장이 도장이라 상부장도 도장 24색(Claude 해석, provisional). 아일랜드 무늬목 7종, 키큰장·하부장 도장 24색. 상판·가전·손잡이 고정 */
const PARTS=[{k:'Upper',name:'상부장',sub:'',pick:PT.map(p=>'PT'+p[0]),cls:'pt'},{k:'Island',name:'아일랜드',sub:'',pick:WD.map(w=>'WD'+w[0]),cls:'wd'},{k:'Tall',name:'키큰장',sub:'',pick:PT.map(p=>'PT'+p[0]),cls:'pt'},{k:'Base',name:'하부장',sub:'',pick:PT.map(p=>'PT'+p[0]),cls:'pt'}];
const ALTS=[
  {key:1,label:'배색',cols:['white','oak','cer'],parts:{Upper:'PT09',Island:'WD01',Tall:'PT09',Base:'PT09'},renders:[

  ]}
];
const ZIP='';

/* ---- 공통 ---- */
const $=id=>document.getElementById(id);
let alt=ALTS[0],ri=0,cur='images';
function capText(a){return a.label+' · '+a.cols.map(k=>(COLORS[k].code?COLORS[k].code+' · ':'')+COLORS[k].name).join(' / ')}
ALTS.forEach(a=>{const b=document.createElement('button');b.textContent=a.label;b.onclick=()=>setAlt(a.key,true);$('altTabs').appendChild(b)});
if(ALTS.length<2)document.querySelector('.alts .tabs').classList.add('hide');
function setAlt(k,push){alt=ALTS.find(a=>a.key===k)||ALTS[0];
  [...$('altTabs').children].forEach((b,i)=>b.classList.toggle('on',ALTS[i]===alt));
  $('altCap').textContent=capText(alt);applyColors();
  ri=Math.min(ri,Math.max(0,alt.renders.length-1));showR(ri);if(push)writeHash()}

/* ---- 렌더 ---- */
function showR(i){const R=alt.renders;$('nR').textContent=ALTS.reduce((s,a)=>s+a.renders.length,0)||'';
  const has=R.length>0;['rImg','prev','next','zoom','dl','thumbs'].forEach(id=>$(id).classList.toggle('hide',!has));$('rEmpty').classList.toggle('hide',has);
  $('thumbs').innerHTML='';
  if(!has){$('rCount').textContent='';$('rDesc').textContent='';return}
  ri=(i+R.length)%R.length;const r=R[ri];
  $('rImg').src=r.src;$('rImg').alt=r.label;$('rDesc').textContent=r.desc||'';
  $('rCount').textContent=String(ri+1).padStart(2,'0')+' / '+String(R.length).padStart(2,'0');
  $('dlOne').href=r.src;$('dlAll').href=ZIP;$('dlAll').classList.toggle('hide',!ZIP);$('dlAll').textContent=ALTS.reduce((s,a)=>s+a.renders.length,0)+'장 모두 저장 ↓';
  R.forEach((x,k)=>{const b=document.createElement('button');b.className=k===ri?'on':'';b.innerHTML=`<img src="${x.thumb||x.src}" alt=""><span>${x.label}</span>`;b.onclick=()=>{showR(k);writeHash()};$('thumbs').appendChild(b)})}
$('prev').onclick=()=>{showR(ri-1);writeHash()};$('next').onclick=()=>{showR(ri+1);writeHash()};
let sx=null;$('rImg').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});

  const key=new THREE.DirectionalLight(0xfff8ee,1.5);key.position.set(-6,7.5,1.2);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=4;

<script>
(()=>{const body=document.getElementById('cpBody');if(!body)return;
function setup(g){const sw=g.querySelector('.cp-sw');if(!sw||g.dataset.nav)return;g.dataset.nav=1;
  const bs=[...sw.children];if(bs.length<2)return;
  const nav=document.createElement('div');nav.className='cp-nav';
  nav.innerHTML='<button type="button" aria-label="이전 색">‹</button><span></span><button type="button" aria-label="다음 색">›</button>';
  const nm=g.querySelector('.cp-name');const ft=document.createElement('div');ft.className='cp-foot';sw.after(ft);if(nm)ft.appendChild(nm);ft.appendChild(nav);const [prev,lab,next]=[nav.children[0],nav.children[1],nav.children[2]];
  const step=()=>bs[1].offsetLeft-bs[0].offsetLeft;
  const per=()=>Math.max(1,Math.floor((sw.clientWidth-8+step()-28)/step())+0);
  const pages=()=>Math.ceil(bs.length/per());
  const snap=()=>{const p=per();bs.forEach((b,i)=>{b.style.scrollSnapAlign=i%p?'none':'start'})};
  const pageNow=()=>Math.round(sw.scrollLeft/(step()*per()));
  const upd=()=>{const n=pages(),c=Math.min(n-1,pageNow());lab.textContent=(c+1)+' / '+n;prev.disabled=c<=0;next.disabled=c>=n-1};
  const go=p=>{const n=pages();p=Math.max(0,Math.min(n-1,p));sw.scrollTo({left:bs[p*per()].offsetLeft-bs[0].offsetLeft,behavior:'smooth'})};
  prev.onclick=()=>go(pageNow()-1);next.onclick=()=>go(pageNow()+1);
  sw.addEventListener('scroll',upd,{passive:true});
  sw.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();go(pageNow()+(e.deltaY>0?1:-1))}},{passive:false});
  snap();const on=bs.findIndex(b=>b.classList.contains('on'));
  if(on>0){const p=Math.floor(on/per());sw.scrollLeft=bs[p*per()].offsetLeft-bs[0].offsetLeft}
  upd();
}
const run=()=>body.querySelectorAll('.cp-group.pt,.cp-group.wd').forEach(setup);
new MutationObserver(run).observe(body,{childList:true});run();
addEventListener('resize',()=>body.querySelectorAll('.cp-group.pt,.cp-group.wd').forEach(g=>{delete g.dataset.nav;const f=g.querySelector('.cp-foot');if(f){const nm=f.querySelector('.cp-name');if(nm)f.before(nm);f.remove()}setup(g)}));
})();
</script>
<!-- 상담사용 펜 메모 (규칙 97, 2026-11-24). 주소에 ?memo=1 이 있을 때만 보임 -->
<style>
#memoBtn{position:fixed;right:18px;bottom:18px;z-index:60;height:46px;padding:0 18px;border-radius:999px;border:0;background:#34322b;color:#fff;font:600 14px/1 inherit;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.memo-layer{position:absolute;inset:0;z-index:40;touch-action:none;cursor:crosshair}
.memo-layer canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.memo-bar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(250,248,244,.96);border:1px solid #e3dccf;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:2}
.memo-bar button{height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid #e3dccf;background:#fff;color:#34322b;font:500 13px/1 inherit;cursor:pointer;white-space:nowrap}
.memo-bar button.on{background:#34322b;color:#fff;border-color:#34322b}
.memo-bar .dot{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:middle}
.memo-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:#6f6455;background:rgba(250,248,244,.9);padding:5px 10px;border-radius:999px;pointer-events:none}
</style>
<script>
(()=>{if(new URLSearchParams(location.search).get('memo')!=='1')return;
const PROJECT='SC-project';
const btn=document.createElement('button');btn.id='memoBtn';btn.textContent='✎ 펜 메모';document.body.appendChild(btn);
let layer=null,cv,cx,strokes=[],curS=null,tool='red',penSeen=false;
const COL={red:'#d62020',black:'#111'};
function host(){return cur==='space'?document.getElementById('wrap'):document.querySelector('#secR .stage')}
function size(){const r=layer.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);cx.setTransform(d,0,0,d,0,0);redraw()}
function seg(s,a,b){cx.globalCompositeOperation=s.t==='eraser'?'destination-out':'source-over';cx.strokeStyle=s.t==='eraser'?'#000':COL[s.t];cx.lineCap=cx.lineJoin='round';cx.lineWidth=s.t==='eraser'?26:b[2];cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}
function draw(s){const p=s.p;if(p.length===1){seg(s,p[0],[p[0][0]+.01,p[0][1],p[0][2]]);return}for(let i=1;i<p.length;i++)seg(s,p[i-1],p[i])}
function redraw(){cx.clearRect(0,0,cv.width,cv.height);strokes.forEach(draw);cx.globalCompositeOperation='source-over'}
function pt(e){const r=cv.getBoundingClientRect();const pr=e.pointerType==='mouse'?.5:(e.pressure||.5);return[e.clientX-r.left,e.clientY-r.top,1.2+pr*4.8]}
function down(e){if(e.pointerType==='pen')penSeen=true;if(penSeen&&e.pointerType==='touch')return;/* 펜슬을 쓰면 손가락·손바닥은 무시 */
  e.preventDefault();cv.setPointerCapture(e.pointerId);curS={t:tool,p:[pt(e)],id:e.pointerId};strokes.push(curS);draw(curS)}
function move(e){if(!curS||e.pointerId!==curS.id)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const q=pt(ev),l=curS.p[curS.p.length-1];curS.p.push(q);seg(curS,l,q)}cx.globalCompositeOperation='source-over'}
function up(e){if(curS&&e.pointerId===curS.id)curS=null}
function open(){const h=host();if(!h)return;if(getComputedStyle(h).position==='static')h.style.position='relative';
  if(typeof controls!=='undefined'&&controls)controls.enabled=false;/* 펜을 켜면 3D 회전·렌더 넘김이 멈춤 */
  layer=document.createElement('div');layer.className='memo-layer';
  layer.innerHTML='<canvas></canvas><div class="memo-bar"><button data-t="red" class="on"><span class="dot" style="background:#d62020"></span></button><button data-t="black"><span class="dot" style="background:#111"></span></button><button data-t="eraser">지우개</button><button data-a="undo">되돌리기</button><button data-a="save">이미지로 저장</button><button data-a="close">닫기</button></div><div class="memo-hint">애플펜슬로 그려 주세요</div>';
  h.appendChild(layer);cv=layer.querySelector('canvas');cx=cv.getContext('2d');strokes=[];size();
  cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  ['touchstart','touchmove','wheel','gesturestart'].forEach(t=>layer.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  layer.querySelector('.memo-bar').addEventListener('pointerdown',e=>e.stopPropagation());
  layer.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;layer.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b))});
  layer.querySelector('[data-a=undo]').onclick=()=>{strokes.pop();redraw()};
  layer.querySelector('[data-a=save]').onclick=save;layer.querySelector('[data-a=close]').onclick=close;
  addEventListener('resize',size);btn.style.display='none'}
function close(){if(!layer)return;removeEventListener('resize',size);layer.remove();layer=null;if(typeof controls!=='undefined'&&controls)controls.enabled=true;btn.style.display=''}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())}
async function save(){const h=host(),hr=h.getBoundingClientRect(),d=devicePixelRatio||1;
  const out=document.createElement('canvas');out.width=Math.round(hr.width*d);out.height=Math.round(hr.height*d);const o=out.getContext('2d');o.fillStyle='#e9e6df';o.fillRect(0,0,out.width,out.height);
  try{let bg;if(cur==='space'){if(typeof composer!=='undefined'&&composer)composer.render();bg=document.getElementById('gl')}else bg=document.getElementById('rImg');
    if(bg){const br=bg.getBoundingClientRect();o.drawImage(bg,(br.left-hr.left)*d,(br.top-hr.top)*d,br.width*d,br.height*d)}}catch(e){}
  o.drawImage(cv,0,0,out.width,out.height);
  const name=PROJECT+'_메모_'+stamp()+'.png';
  const blob=await new Promise(r=>out.toBlob(r,'image/png'));const file=new File([blob],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
btn.onclick=open;
})();
</script>
