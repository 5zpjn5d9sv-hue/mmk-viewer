  for(const o of data){
    const pos=new Float32Array(o.v.length);
    for(let i=0;i<o.v.length;i+=3){const v=toV(o.v[i],o.v[i+1],o.v[i+2]);pos[i]=v.x;pos[i+1]=v.y;pos[i+2]=v.z}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(o.f);g.computeVertexNormals();
    if(!mats[o.l]){
      const c=o.l==='PAINT'?PAINT[paintKey].hex:(COL[o.l]??0xeeeeea);
      mats[o.l]=new THREE.MeshStandardMaterial({color:c,roughness:ROUGH[o.l]??.85,metalness:METAL[o.l]??0,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
    }
    const mesh=new THREE.Mesh(g,mats[o.l]);
    const isCtx=(o.l==='WALL_WHITE'||o.l==='WALL_BLACK'||o.l==='CEIL');
    const grp=o.l==='CEIL'?ceilGroup:(isCtx?ctxGroup:main);grp.add(mesh);
    if(o.l!=='PB'&&o.l!=='STS'&&o.l!=='FLOOR'){const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,25),o.l==='PAINT'&&PAINT[paintKey].dark?edgeDark:edgeMat);e.userData.paint=o.l==='PAINT';grp.add(e);if(o.l==='PAINT')paintEdges.push(e)}
  }
  $('loading').style.display='none';
  resize();goCam('diag');
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
}
function resize(){if(!renderer)return;const w=$('wrap').clientWidth,h=$('wrap').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
$('views').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.c;if(k&&camera)goCam(k)});
let ctxOn=true;
$('ctx').onclick=()=>{if(!ctxGroup)return;ctxOn=!ctxOn;ctxGroup.visible=ctxOn;ceilGroup.visible=ctxOn;$('ctx').classList.toggle('on',ctxOn)};
/* 장 컬러 */
function setPaint(k){paintKey=k;
  if(mats.PAINT)mats.PAINT.color.setHex(PAINT[k].hex);
  paintEdges.forEach(e=>e.material=(PAINT[k].dark?edgeDark:edgeMat));
  [...$('sw').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('mat').innerHTML='아일랜드 <b>MMK WD 03 Dark Brown Oak</b> · 장(홈바·키큰장·상하부장) <b>'+PAINT[k].name+'</b> · 아일랜드·홈바 상판 STS 3T · 벽면 상판 블랙 12T';
  const want=RENDERS.findIndex(r=>r.color===k);if(want>=0)showR(want);
}
Object.entries(PAINT).forEach(([k,p])=>{const b=document.createElement('button');b.dataset.k=k;
  b.innerHTML=`<i style="background:#${p.hex.toString(16).padStart(6,'0')}"></i>${p.name.replace('MMK_','')}`;b.onclick=()=>setPaint(k);$('sw').appendChild(b)});
{const f=document.createElement('span');f.className='fixed';f.textContent='아일랜드 무늬목은 WD 03 고정 · 화면 색은 참고용이며 실제 샘플과 다를 수 있어요';$('sw').appendChild(f)}
setPaint('PT16');window.__ready=1;

setView(location.hash==='#renders'&&RENDERS.length?'renders':(RENDERS.length&&location.hash!=='#space'?'renders':'space'));
</script>
