<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMK · 올림픽훼밀리타운 공간 뷰어</title>
<meta name="description" content="1가지 배색 · 렌더 2컷 · 3D 색상 선택">
<meta property="og:title" content="MMK · 올림픽훼밀리타운">
<meta property="og:description" content="1가지 배색 · 렌더 2컷 · 3D 색상 선택">
<meta property="og:image" content="https://5zpjn5d9sv-hue.github.io/mmk-viewer/songpa/assets/option1/main.png">
<meta property="og:image:width" content="1672">
<meta property="og:image:height" content="941">
<meta property="og:url" content="https://5zpjn5d9sv-hue.github.io/mmk-viewer/songpa/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/mmk-logo.png">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f1eee8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f1eee8;--ink:#1d1d1b;--mute:#8a867e;--line:#dcd7cd;--card:#e9e5dd}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{height:20px;width:auto;display:block}
  .proj{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:14px;min-width:0}
  .proj b{font:600 13px "Noto Sans KR",Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;background:var(--card);border-radius:999px;padding:3px}
  .seg button{border:0;background:none;font:500 12.5px Inter,"Noto Sans KR";color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--ink);color:#fff}
  .seg .n{display:inline-block;margin-left:6px;font-size:11px;opacity:.6}
  .right{justify-self:end}
  .icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:14px}
  .alts{padding:12px 22px;border-bottom:1px solid var(--line)}
  .alttabs{display:flex;gap:6px;margin-bottom:8px}
  .alttabs button{border:1px solid var(--line);background:#fff;font:500 12px Inter;padding:6px 12px;border-radius:999px;cursor:pointer}
  .alttabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .altcap{font-size:11.5px;color:var(--mute);line-height:1.6}
  main{max-width:1180px;margin:0 auto;padding:26px 22px 40px}
  .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--mute)}
  .titlebar{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 14px;gap:12px}
  .titlebar h2{font:500 19px "Noto Sans KR",Inter}
  .count{font-size:11px;color:var(--mute);letter-spacing:.1em}
  .stage{position:relative;background:var(--card);aspect-ratio:16/9;overflow:hidden;border-radius:2px}
  .stage img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mute);line-height:1.8}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .arrow.l{left:14px}.arrow.r{right:14px}
  .zoombtn{position:absolute;right:14px;bottom:14px;border:0;background:#fff;font:500 11.5px "Noto Sans KR";padding:8px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .caption{margin-top:12px;font-size:12px;line-height:1.7;color:#4a4740}
  .caption b{font-weight:600;color:var(--ink);margin-right:8px}
  .saves{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .saves a{font:500 11.5px "Noto Sans KR";color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;padding:7px 12px}
  .note{font-size:11px;color:var(--mute);margin-top:10px}
  .thumbs{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .thumbs button{border:1px solid transparent;background:none;padding:3px;cursor:pointer;text-align:left}
  .thumbs button.on{border-color:var(--ink)}
  .thumbs img{display:block;width:140px;aspect-ratio:16/9;object-fit:cover;background:var(--card)}
  .thumbs span{display:block;font-size:10.5px;margin-top:4px;color:#4a4740}
  #secS{display:none}
  .space-wrap{position:relative;background:#e9e6df;aspect-ratio:16/9;border-radius:2px;overflow:hidden;touch-action:none}
  #gl{width:100%;height:100%;display:block}
  .views{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap}
  .views button,.toggles button{border:0;background:rgba(255,255,255,.94);font:500 11.5px "Noto Sans KR";padding:7px 11px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .views button.on,.toggles button.on{background:var(--ink);color:#fff}
  .toggles{position:absolute;right:14px;top:14px;display:flex;gap:6px}
  .hint{position:absolute;left:14px;bottom:12px;font-size:10.5px;color:#6d6a63;background:rgba(255,255,255,.8);padding:4px 8px}
  .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--mute)}
  .picker{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .part{background:#fff;border:1px solid var(--line);padding:10px 12px}
  .part h3{font:500 12px "Noto Sans KR";margin-bottom:8px}
  .sw{display:flex;gap:8px;flex-wrap:wrap}
  .sw button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:4px 8px 4px 4px;font:500 10.5px Inter,"Noto Sans KR";cursor:pointer;border-radius:999px}
  .sw button i{width:18px;height:18px;border-radius:50%;border:1px solid #0002;display:block}
  .sw button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .resetc{margin-top:10px;border:0;background:none;font:500 11px "Noto Sans KR";color:var(--mute);text-decoration:underline;cursor:pointer}
  .modal{position:fixed;inset:0;background:#111;display:none;z-index:50;touch-action:none}
  .modal.on{display:block}
  .modal img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
  .mbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));color:#fff;font-size:12px;z-index:2;background:linear-gradient(#000a,#0000)}
  .mbar button{border:1px solid #fff5;background:#0006;color:#fff;font:500 12px "Noto Sans KR";padding:6px 10px;cursor:pointer}
  .zoomctl{display:flex;gap:6px;align-items:center}
  .mhint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fffa;font-size:11px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
  @media (max-width:720px){
    header{grid-template-columns:1fr auto;grid-template-areas:"b r" "s s";padding:12px 14px}
    .brand{grid-area:b}.right{grid-area:r}.seg{grid-area:s;justify-self:center}
    .logo{height:17px}.proj{padding-left:10px}
    .alts,main{padding-left:14px;padding-right:14px}
    .thumbs img{width:110px}
    .space-wrap{aspect-ratio:4/5}
    .arrow{width:34px;height:34px}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="assets/mmk-logo.png" alt="MMK">
    <div class="proj"><b id="projName">올림픽훼밀리타운</b><span id="projAddr">서울 송파구 문정동</span></div></div>
  <div class="seg" role="tablist">
    <button id="tabR" data-v="images">렌더 이미지<span class="n" id="nR"></span></button>
    <button id="tabS" data-v="space">3D 공간</button>
  </div>
  <div class="right"><button class="icon" id="share" title="링크 복사" aria-label="링크 복사">⤴</button></div>
</header>
<div class="alts">
  <div class="alttabs" id="altTabs"></div>
  <div class="altcap" id="altCap"></div>
</div>

<main>
  <section id="secR">
    <div class="eyebrow">RENDER</div>
    <div class="titlebar"><h2>전체 컷</h2><div class="count" id="rCount"></div></div>
    <div class="stage" id="stage">
      <img id="rImg" alt="">
      <div class="empty" id="rEmpty">렌더 이미지는 준비 중입니다.<br>먼저 3D 공간에서 배치와 색을 확인해 주세요.</div>
      <button class="arrow l" id="prev" aria-label="이전">‹</button>
      <button class="arrow r" id="next" aria-label="다음">›</button>
      <button class="zoombtn" id="zoom">크게 보기 ⤢</button>
    </div>
    <div class="caption" id="rCap"></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="saves" id="saves"></div>
    <div class="note">설계 검토용 · 렌더 이미지와 3D의 재질 표현에는 차이가 있습니다.</div>
  </section>

  <section id="secS">
    <div class="eyebrow">3D SPACE</div>
    <div class="titlebar"><h2>3D 공간</h2><div class="count">드래그로 회전 · 두 손가락으로 확대</div></div>
    <div class="space-wrap" id="wrap">
      <canvas id="gl"></canvas>
      <div class="loading" id="loading">3D 공간을 불러오는 중…</div>
      <div class="views" id="views">
        <button data-c="kitchen" class="on">주방</button>
        <button data-c="utility">다용도실</button>
        <button data-c="diag">사선</button>
        <button data-c="top">위에서</button>
      </div>
      <div class="toggles"><button id="ctx">주변 벽</button></div>
      <div class="hint">벽·도어·장 윤곽선 표시</div>
    </div>
    <div class="picker" id="picker"></div>
    <button class="resetc" id="resetC">처음 배색으로</button>
    <div class="note">3D는 배치와 분할 확인용입니다. 재질과 빛은 렌더 이미지를 기준으로 봐 주세요.</div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="mbar"><button id="mClose">전체 컷 닫기 ×</button>
    <div class="zoomctl"><button id="zOut">−</button><span id="zPct">100%</span><button id="zIn">＋</button></div>
  </div>
  <img id="mImg" alt="">
  <div class="mhint">두 손가락으로 확대 · 끌어서 이동</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 현장 데이터 ---------- */
const COLORS={
  PT02:{code:'MMK PT 02',name:'Lime yellow',hex:'#dcd8bb'},
  PT09:{code:'MMK PT 09',name:'Salt white',hex:'#e6e6da'},
  DUPONT:{code:'듀폰 12T',name:'화이트',hex:'#f2f0e8'},
  HIMACS:{code:'LX 하이막스 12T',name:'화이트',hex:'#f1f1eb'}
};
const PARTS=[
  {k:'kbase',name:'주방 하부장 도어',opts:['PT02','PT09']},
  {k:'ubase',name:'다용도실 하부장 도어',opts:['PT09','PT02']},
  {k:'upper',name:'상부장 도어',opts:['PT09','PT02']},
  {k:'tall',name:'키큰장 도어',opts:['PT09','PT02']},
  {k:'counter',name:'상판',opts:['DUPONT','HIMACS']}
];
const OPTIONS=[ /* 시안 */
  {label:'Alt1',set:{kbase:'PT02',ubase:'PT09',upper:'PT09',tall:'PT09',counter:'DUPONT'},
   renders:[
     {key:'main',src:'assets/option1/main.webp',orig:'assets/option1/main.png',thumb:'assets/option1/main_t.webp',label:'01 본주방',desc:'본주방 하부장과 띠창, 타일 벽을 정면에서 보는 구도'},
     {key:'utility',src:'assets/option1/utility.webp',thumb:'assets/option1/utility_t.webp',label:'02 세탁실',desc:'긴 하부장과 워시타워 장을 함께 보는 구도'}],
   zip:'assets/songpa_1_originals.zip'}
];
/* ---------- 상태 ---------- */
const $=id=>document.getElementById(id);
let opt=0,ri=0,cur='space';
function altCaption(o){const used=[...new Set(Object.entries(o.set).filter(([k])=>k!=='counter').map(([,v])=>v))];
  return o.label+' · '+used.map(c=>COLORS[c].code+' · '+COLORS[c].name).join(' / ')}
function drawAlts(){
  $('altTabs').innerHTML='';
  if(OPTIONS.length>1)OPTIONS.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.label;b.className=i===opt?'on':'';b.onclick=()=>{setOpt(i)};$('altTabs').appendChild(b)});
  else $('altTabs').style.display='none';
  $('altCap').textContent=altCaption(OPTIONS[opt]);
}
function setOpt(i){opt=i;ri=0;drawAlts();showR(0);applySet(OPTIONS[opt].set);syncHash()}
/* ---------- 렌더 ---------- */
function R(){return OPTIONS[opt].renders}
function showR(i){
  const rs=R();$('nR').textContent=rs.length||'';
  const has=rs.length>0;
  ['prev','next','zoom'].forEach(id=>$(id).style.display=has&&(id==='zoom'||rs.length>1)?'':'none');
  $('rEmpty').style.display=has?'none':'grid';$('rImg').style.display=has?'block':'none';
  $('thumbs').innerHTML='';$('saves').innerHTML='';
  if(!has){$('rCount').textContent='';$('rCap').textContent='';return}
  ri=(i+rs.length)%rs.length;const r=rs[ri];
  $('rImg').src=r.src;$('rImg').alt=r.label;
  $('rCount').textContent=String(ri+1).padStart(2,'0')+' / '+String(rs.length).padStart(2,'0');
  $('rCap').innerHTML='<b>'+r.label+'</b>'+r.desc;
  rs.forEach((x,k)=>{const b=document.createElement('button');b.className=k===ri?'on':'';b.innerHTML=`<img src="${x.thumb}" alt=""><span>${x.label}</span>`;b.onclick=()=>{showR(k);syncHash()};$('thumbs').appendChild(b)});
  if(OPTIONS[opt].zip)$('saves').insertAdjacentHTML('beforeend',`<a href="${OPTIONS[opt].zip}" download>${rs.length}장 모두 저장 ↓</a>`);
  $('saves').insertAdjacentHTML('beforeend',`<a href="${r.orig||r.src}" download>원본 저장 ↓</a>`);
}
$('prev').onclick=()=>{showR(ri-1);syncHash()};$('next').onclick=()=>{showR(ri+1);syncHash()};
let sx=null;$('rImg').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('rImg').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){showR(ri+(dx<0?1:-1));syncHash()}sx=null});
/* 크게 보기 */
let sc=1,tx=0,ty=0,nat={w:1,h:1},base=1;const mImg=$('mImg');
function fit(){base=Math.min(innerWidth/nat.w,innerHeight/nat.h)}
function apply(){const s=base*sc;mImg.style.width=nat.w*s+'px';mImg.style.height=nat.h*s+'px';mImg.style.transform=`translate(${-nat.w*s/2+tx}px,${-nat.h*s/2+ty}px)`;$('zPct').textContent=Math.round(sc*100)+'%'}
function openM(){const r=R()[ri];if(!r)return;mImg.onload=()=>{nat={w:mImg.naturalWidth,h:mImg.naturalHeight};fit();sc=1;tx=ty=0;apply()};mImg.src=r.orig||r.src;$('modal').classList.add('on')}
$('zoom').onclick=openM;$('rImg').onclick=openM;$('mClose').onclick=()=>$('modal').classList.remove('on');
const clamp=v=>Math.min(6,Math.max(1,v));
$('zIn').onclick=()=>{sc=clamp(sc*1.4);apply()};$('zOut').onclick=()=>{sc=clamp(sc/1.4);if(sc===1)tx=ty=0;apply()};
$('modal').addEventListener('wheel',e=>{e.preventDefault();sc=clamp(sc*(e.deltaY<0?1.15:1/1.15));if(sc===1)tx=ty=0;apply()},{passive:false});
const pts=new Map();let last=null,pd=0,ps=1;
$('modal').addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const[a,b]=[...pts.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);ps=sc}last={x:e.clientX,y:e.clientY}});
$('modal').addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const[a,b]=[...pts.values()];sc=clamp(ps*Math.hypot(a.x-b.x,a.y-b.y)/pd);apply()}
  else if(sc>1&&last){tx+=e.clientX-last.x;ty+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};apply()}});
['pointerup','pointercancel','pointerleave'].forEach(t=>$('modal').addEventListener(t,e=>{pts.delete(e.pointerId);if(pts.size<2)last=null}));
addEventListener('resize',()=>{if($('modal').classList.contains('on')){fit();apply()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('on');if(!$('modal').classList.contains('on')&&cur==='images'){if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()}});
/* ---------- 화면 전환 / 주소 ---------- */
function syncHash(){const h=cur==='images'?'#images/'+(R()[ri]?R()[ri].key:'main')+'?option='+(opt+1):'#space?option='+(opt+1);if(location.hash!==h)history.replaceState(null,'',h)}
function setView(v){cur=v;$('secR').style.display=v==='images'?'block':'none';$('secS').style.display=v==='space'?'block':'none';
  $('tabR').classList.toggle('on',v==='images');$('tabS').classList.toggle('on',v==='space');if(v==='space')initGL();syncHash()}
$('tabR').onclick=()=>setView('images');$('tabS').onclick=()=>setView('space');
function readHash(){const h=location.hash.slice(1);const m=h.match(/option=(\d+)/);if(m)opt=Math.min(OPTIONS.length,Math.max(1,+m[1]))-1;
  if(h.startsWith('images')){const key=h.split('/')[1]?.split('?')[0];const k=R().findIndex(r=>r.key===key);ri=k<0?0:k;return 'images'}
  if(h.startsWith('space'))return 'space';return R().length?'images':'space'}
$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('링크를 복사했어요')}catch(e){toast('주소창의 링크를 복사해 주세요')}};
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)}
/* ---------- 3D ---------- */
let glReady=false,renderer,scene,camera,controls,ctxGroup;const groupMats={};let chosen={};
// 작업 공간 중심 (Rhino mm, X 동 · Y 북 · Z 위)
const K={x:3950,y:-1100};
const toV=(x,y,z)=>new THREE.Vector3((x-K.x)/1000,z/1000,-(y-K.y)/1000);
const PRESET={
  kitchen:{pos:[3450,-2050,1500],tgt:[1500,-750,1050]},
  utility:{pos:[4560,-1650,1450],tgt:[7200,-1000,1050]},
  diag:{pos:[6400,-6200,5200],tgt:[3800,-1100,600]},
  top:{pos:[3950,-1150,11000],tgt:[3950,-1100,0]}};
function goCam(k){const p=PRESET[k];camera.position.copy(toV(...p.pos));controls.target.copy(toV(...p.tgt));controls.update();
  [...$('views').children].forEach(b=>b.classList.toggle('on',b.dataset.c===k))}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function applySet(set){chosen={...set};for(const k in set){if(groupMats[k])groupMats[k].color.set(COLORS[set[k]].hex)}drawPicker()}
function drawPicker(){$('picker').innerHTML='';PARTS.forEach(p=>{const d=document.createElement('div');d.className='part';
  d.innerHTML=`<h3>${p.name}</h3><div class="sw"></div>`;const sw=d.querySelector('.sw');
  p.opts.forEach(c=>{const b=document.createElement('button');b.className=chosen[p.k]===c?'on':'';b.innerHTML=`<i style="background:${COLORS[c].hex}"></i>${COLORS[c].code} ${COLORS[c].name}`;
    b.onclick=()=>{chosen[p.k]=c;if(groupMats[p.k])groupMats[p.k].color.set(COLORS[c].hex);drawPicker()};sw.appendChild(b)});
  $('picker').appendChild(d)})}
$('resetC').onclick=()=>applySet(OPTIONS[opt].set);
async function initGL(){
  if(glReady){resize();return}glReady=true;
  try{await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');}
  catch(e){$('loading').textContent='3D 도구를 불러오지 못했어요. 새로고침해 주세요.';glReady=false;return}
  const cv=$('gl');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
  scene=new THREE.Scene();scene.background=new THREE.Color(0xe9e6df);
  camera=new THREE.PerspectiveCamera(58,1,0.05,200);
  controls=new THREE.OrbitControls(camera,cv);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=.3;controls.maxDistance=30;
  scene.add(new THREE.HemisphereLight(0xffffff,0xd9cfc0,.85));
  const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-6,9,4);scene.add(sun);
  const fill=new THREE.DirectionalLight(0xffffff,.25);fill.position.set(5,6,-6);scene.add(fill);
  let data;try{data=window.__MODEL__||await (await fetch('model.json')).json()}catch(e){$('loading').textContent='3D 데이터를 불러오지 못했어요.';return}
  ctxGroup=new THREE.Group();ctxGroup.visible=false;const main=new THREE.Group();scene.add(ctxGroup,main);
  const edgeMat=new THREE.LineBasicMaterial({color:0xb9b6ae});const mats={};
  const MOVABLE=['kbase','ubase','upper','tall','counter'];
  for(const o of data){
    const pos=new Float32Array(o.v.length);
    for(let i=0;i<o.v.length;i+=3){const v=toV(o.v[i],o.v[i+1],o.v[i+2]);pos[i]=v.x;pos[i+1]=v.y;pos[i+2]=v.z}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(o.f);g.computeVertexNormals();
    let m;
    if(MOVABLE.includes(o.g)){m=groupMats[o.g]||(groupMats[o.g]=new THREE.MeshStandardMaterial({color:o.c,roughness:.85,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}))}
    else{const metal=o.c==='#a5abaf';const glass=o.c==='#29363d';
      m=mats[o.c]||(mats[o.c]=new THREE.MeshStandardMaterial({color:o.c,roughness:metal?.35:.9,metalness:metal?.6:0,transparent:glass,opacity:glass?.55:1,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}))}
    const mesh=new THREE.Mesh(g,m);const grp=o.g==='ctx'?ctxGroup:main;grp.add(mesh);
    if(o.e)grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,25),edgeMat));
  }
  $('loading').style.display='none';applySet(OPTIONS[opt].set);resize();goCam('kitchen');
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
}
function resize(){if(!renderer)return;const w=$('wrap').clientWidth,h=$('wrap').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
$('views').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.c;if(k&&camera)goCam(k)});
$('ctx').onclick=()=>{if(!ctxGroup)return;ctxGroup.visible=!ctxGroup.visible;$('ctx').classList.toggle('on',ctxGroup.visible)};
/* ---------- 시작 ---------- */
drawAlts();chosen={...OPTIONS[opt].set};drawPicker();
const start=readHash();drawAlts();showR(ri);setView(start);
</script>
