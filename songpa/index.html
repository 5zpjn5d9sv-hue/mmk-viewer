<style>
  :root{--bg:#f1eee8;--bar:#f8f6f1;--ink:#302e29;--dark:#34322b;--mute:#837a6c;--mute2:#8a7a68;--line:#dcd5c9;--line2:#ded7cd;--stage:#e8e4dc}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  /* header */
  header{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:90px;padding:0 32px;background:var(--bar);border-bottom:1px solid #e6e0d5;padding-top:env(safe-area-inset-top)}
  .identity{display:flex;align-items:center;gap:20px;text-decoration:none;min-width:0}
  .identity img{height:24px;width:auto;display:block}
  .brand-rule{width:1px;height:28px;background:#d3cbbd;flex:none}
  .identity span{display:flex;flex-direction:column;gap:7px;min-width:0}
  .identity strong{font-weight:700;font-size:14px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .identity small{font-size:10px;line-height:14px;color:#81766a;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mode-switch{display:flex;background:#efece5;border:1px solid var(--line2);border-radius:40px;padding:4px}
  .mode-switch button{height:37px;padding:0 21px;border:0;border-radius:30px;background:none;font-size:12px;color:var(--mute);white-space:nowrap}
  .mode-switch button.on{background:var(--dark);color:#faf8f4}
  .mode-switch .n{font-size:9px;margin-left:6px}
  .header-actions{justify-self:end;display:flex;gap:9px}
  .icon-button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(248,246,241,.867);display:grid;place-items:center}
  .icon-button svg{width:18px;height:18px}
  /* option bar */
  .option-bar{display:flex;align-items:center;gap:18px;min-height:54px;padding:7px 34px;background:var(--bar);border-bottom:1px solid #e6e0d5}
  .option-buttons{display:flex;border:1px solid #ddd6ca;border-radius:30px;padding:3px}
  .option-buttons button{height:30px;padding:0 25px;border:0;border-radius:25px;background:none;font-size:12px}
  .option-buttons button.on{background:var(--dark);color:#fff}
  .option-cap{font-size:10px;color:#6f675b;line-height:1.5}
  /* render */
  main{padding:26px 34px 30px}
  .kicker{font-size:9px;letter-spacing:1.9px;color:var(--mute2);text-transform:uppercase}
  .titlerow{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 14px}
  .titlerow h1{font-weight:400;font-size:24px;letter-spacing:-1px;line-height:32px}
  .counter{font-size:10px;letter-spacing:1.5px;color:var(--mute)}
  .stage{position:relative;background:var(--stage);height:min(58vw,calc(100vh - 330px));min-height:240px;overflow:hidden}
  .stage .image-open{position:absolute;inset:0;border:0;background:none;cursor:zoom-in}
  .stage img{width:100%;height:100%;object-fit:contain;display:block}
  .gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(247,243,235,.867);font:200 28px/1 Arial;display:grid;place-items:center;padding-bottom:3px}
  .gallery-arrow.prev{left:16px}.gallery-arrow.next{right:16px}
  .expand-button{position:absolute;right:16px;bottom:16px;height:32px;padding:0 12px;border:0;border-radius:3px;background:rgba(248,245,238,.91);font-size:10px}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mute);line-height:1.8}
  .meta{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:11px;line-height:1.5}
  .meta .downloads{display:flex;gap:22px;white-space:nowrap}
  .meta a{font-size:10px;text-decoration:none}
  .thumbs{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap}
  .thumbs button{width:130px;padding:5px;border:1px solid transparent;background:none;color:#897b68;text-align:center}
  .thumbs button.on{border-color:#6d5b46;color:var(--ink)}
  .thumbs img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--stage)}
  .thumbs span{display:block;font-size:9px;margin-top:6px}
  .note{text-align:center;font-size:9px;color:#9a8b78;margin-top:14px}
  /* 3D */
  #secS{display:none;position:relative;height:calc(100vh - 145px);min-height:460px;background:#ece9e2;overflow:hidden;touch-action:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  .view-label{position:absolute;left:34px;top:30px;max-width:320px;pointer-events:none}
  .view-label h1{font-weight:400;font-size:24px;letter-spacing:-1px;line-height:32px;margin-top:12px}
  .view-label p{font-size:11px;color:#837b6c;margin-top:10px;line-height:1.5}
  .space-tools{position:absolute;right:34px;top:24px;display:flex;gap:9px;align-items:center}
  .text-button{height:42px;padding:0 16px;border:1px solid var(--line);border-radius:25px;background:rgba(248,246,241,.87);font-size:11px}
  .view-nav{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;background:rgba(249,247,242,.96);border:1px solid #dad1c2;border-radius:36px;padding:5px;box-shadow:0 4px 25px rgba(63,46,21,.035);max-width:calc(100% - 24px);overflow-x:auto}
  .view-nav button{height:43px;padding:0 22px;border:0;border-radius:30px;background:none;font-size:11px;color:#807565;white-space:nowrap}
  .view-nav button.on{background:var(--dark);color:#fff}
  .matching-render{position:absolute;right:34px;bottom:58px;height:34px;padding:0 16px;border:1px solid var(--line);border-radius:24px;background:rgba(250,248,241,.91);font-size:10px}
  .gesture-hint{position:absolute;right:34px;bottom:30px;font-size:9px;color:#857966}
  .color-panel{position:absolute;left:24px;bottom:24px;width:min(620px,calc(100% - 48px));background:rgba(250,248,244,.96);border:1px solid #e3dccf;border-radius:14px;padding:16px 16px 14px;box-shadow:0 4px 25px rgba(63,46,21,.05)}
  .cp-head{display:flex;justify-content:space-between;align-items:center}
  .cp-toggle{border:0;background:none;font-size:12px;padding:0}
  .cp-toggle span{display:inline-block;font-size:10px;margin-left:6px;transition:.2s}
  .color-panel.closed .cp-toggle span{transform:rotate(-90deg)}
  .color-panel.closed .cp-body,.color-panel.closed .color-footnote{display:none}
  .cp-reset{border:0;background:none;font-size:10px;color:#8a7b68;text-decoration:underline;text-underline-offset:2px;padding:1px 0}
  .cp-body{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
  .cp-group h4{font-weight:400;font-size:10px;margin-bottom:9px}
  .cp-sw{display:flex;gap:5px;flex-wrap:nowrap}
  .cp-sw button{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.08);padding:0;position:relative}
  .cp-sw button.on{box-shadow:0 0 0 2px #faf8f4,0 0 0 3.2px #34322b}
  .cp-name{font-size:8.5px;color:#8f8272;margin-top:9px;line-height:1.35;min-height:12px}
  .color-footnote{font-size:9px;line-height:13.5px;color:#9a8b78;margin-top:12px}
  @media (max-width:1400px) and (min-width:721px){.color-panel{bottom:92px}}
  @media (max-width:720px){.color-panel{left:12px;right:12px;width:auto;bottom:70px;padding:12px}.cp-body{gap:10px;grid-template-columns:repeat(2,1fr)}.cp-sw{gap:4px}.cp-sw button{width:17px;height:17px}.view-nav{bottom:12px}.matching-render{display:none}}
  .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--mute)}
  /* lightbox */
  .modal{position:fixed;inset:0;background:#141311;display:none;z-index:50;touch-action:none}
  .modal.on{display:block}
  .modal img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
  .mbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));z-index:2;background:linear-gradient(#000a,#0000)}
  .mbar>button{border:0;background:none;color:#f5f3ed;font-size:13px;padding:0 10px}
  .zoomctl{display:flex;align-items:center}
  .zoomctl button{border:0;background:none;color:#eee;font-size:16px;padding:0 15px;height:36px}
  .mhint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff9;font-size:11px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:11px;padding:9px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.on{opacity:1}
  @media (max-width:720px){
    header{grid-template-columns:1fr auto;grid-template-areas:"b r" "s s";height:auto;padding:14px 16px 12px;row-gap:12px}
    .identity{grid-area:b;gap:12px}.identity img{height:19px}.header-actions{grid-area:r}.mode-switch{grid-area:s;justify-self:center}
    .icon-button{width:38px;height:38px}
    .option-bar{padding:10px 16px;flex-direction:column;align-items:flex-start;gap:8px}
    .option-buttons{max-width:100%;overflow-x:auto}.option-buttons button{padding:0 15px;flex:none}
    main{padding:20px 16px 26px}
    .stage{height:auto;min-height:0;aspect-ratio:16/9}
    .gallery-arrow{width:36px;height:36px;font-size:24px}
    .meta{flex-direction:column;gap:8px}
    .thumbs button{width:110px}
    #secS{height:calc(100vh - 170px)}
    .view-label{left:16px;top:18px}.space-tools{right:16px;top:14px}
    .view-label h1{font-size:20px;margin-top:8px}
    .matching-render{right:16px;bottom:88px}.gesture-hint{display:none}
    .view-nav{bottom:16px}.view-nav button{padding:0 14px;height:38px}
  }
</style>
</head>

<header>

<div class="option-bar">

  <div class="option-cap" id="altCap"></div>
</div>

<main id="secR">

  <div class="titlerow"><h1 id="rTitle">전체 컷</h1><div class="counter" id="rCount"></div></div>
  <div class="stage">
    <button class="image-open" id="openImg" aria-label="크게 보기"><img id="rImg" alt=""></button>

</main>

<section id="secS">
  <canvas id="gl"></canvas>

  <div class="view-label"><span class="kicker" id="vKick"></span><h1 id="vTitle"></h1><p id="vDesc"></p></div>
  <div class="space-tools">
    <button class="text-button" id="ctx">벽체 꺼짐</button>

  </div>
  <div class="color-panel" id="cpanel">
    <div class="cp-head"><button class="cp-toggle" id="cpToggle">색상 변경 <span>⌄</span></button><button class="cp-reset" id="cpReset">시안 배색으로</button></div>

    <p class="color-footnote">상판 화이트 12T · 바닥 오크 마루 · 세탁실 바닥 타일</p>
  </div>
  <nav class="view-nav" id="views"></nav>
  <button class="matching-render" id="toRender">이 구도 렌더 보기 ↗</button>
  <p class="gesture-hint">한 손가락으로 회전 · 두 손가락으로 확대와 이동</p>
</section>

<div class="modal" id="modal">
  <div class="mbar"><button id="mClose">전체 컷 닫기 ×</button>
    <div class="zoomctl"><button id="zOut">−</button><button id="zPct">100%</button><button id="zIn">＋</button></div>
  </div>
  <img id="mImg" alt="">
  <div class="mhint">두 손가락으로 확대 · 끌어서 이동</div>
</div>
<div class="toast" id="toast"></div>

  Object.entries(COLORS).forEach(([k,c])=>{const b=document.createElement('button');b.style.background=c.chip;b.title=c.code+' · '+c.name;b.setAttribute('aria-label',b.title);b.className=chosen[p.k]===k?'on':'';
    b.onclick=()=>{setPart(p.k,k);drawPicker()};d.querySelector('.cp-sw').appendChild(b)});
  $('cpBody').appendChild(d)})}
function resetColors(){chosen={...OPTIONS[opt].set};PARTS.forEach(p=>setPart(p.k,chosen[p.k]));drawPicker()}
$('cpReset').onclick=resetColors;$('cpToggle').onclick=()=>$('cpanel').classList.toggle('closed');
if(matchMedia('(max-width:720px)').matches)$('cpanel').classList.add('closed');
/* ---------- 시작 ---------- */
const start=readHash();chosen={...OPTIONS[opt].set};drawPicker();drawAlts();showR(ri);label();setView(start);
</script>
